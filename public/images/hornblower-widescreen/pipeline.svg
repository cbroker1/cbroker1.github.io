<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 862" width="680" height="862" role="img" aria-label="Flow diagram: the source episode is inspected and prepared into a shared queue of shots; an RTX 4090 in a Windows gaming PC and an RTX A6000 workstation both widen windows from that queue; the generated sides are composited with the original picture, restored to 1920 by 1080 with SeedVR2 on the A6000, encoded on both machines' CPUs, and validated">
